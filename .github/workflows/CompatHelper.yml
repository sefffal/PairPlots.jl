name: CompatHelper
on:
  schedule:
    - cron: 0 0 * * *
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  CompatHelper:
    runs-on: ubuntu-latest
    steps:
      - name: Check if Julia is already available in the PATH
        id: julia_in_path
        run: which julia
        continue-on-error: true
      - name: Install Julia, but only if it is not already available in the PATH
        uses: julia-actions/setup-julia@v3
        with:
          version: '1'
          arch: ${{ runner.arch }}
        if: steps.julia_in_path.outcome != 'success'
      - name: "Add the General registry via Git"
        run: |
          import Pkg
          ENV["JULIA_PKG_SERVER"] = ""
          Pkg.Registry.add("General")
        shell: julia --color=yes {0}
      - name: "Install CompatHelper"
        run: |
          import Pkg
          name = "CompatHelper"
          uuid = "aa819f21-2bde-4658-8897-bab36330d9b7"
          version = "3"
          Pkg.add(; name, uuid, version)
        shell: julia --color=yes {0}
      - name: "Resolve the account CompatHelper's PRs will be authored by"
        id: pr_author
        run: |
          # CompatHelper skips a dependency when an open PR with the same title
          # already exists -- but it only looks at PRs authored by `ci_cfg.username`,
          # which hardcodes "github-actions[bot]" as its default (CompatHelper.jl,
          # src/utilities/ci.jl). The step below deliberately passes
          # COMPATHELPER_TOKEN as GITHUB_TOKEN, so the PRs are authored by *that
          # token's owner* instead; the check then never matches, and a fresh
          # duplicate is opened every night for as long as a compat PR stays
          # unmerged (this is what produced Octofitter.jl #154-#157). Resolve the
          # owner instead of hardcoding a name, so this stays correct if the token
          # is rotated to another account or removed. The default GITHUB_TOKEN
          # cannot read /user, which is exactly the case where the built-in
          # default is already the right answer.
          login="$(gh api /user --jq .login 2>/dev/null || true)"
          echo "login=${login:-github-actions[bot]}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.COMPATHELPER_TOKEN || secrets.GITHUB_TOKEN }}
      - name: "Run CompatHelper"
        run: |
          import CompatHelper
          CompatHelper.main(
              ENV, CompatHelper.GitHubActions(; username=ENV["COMPATHELPER_PR_AUTHOR"])
          )
        shell: julia --color=yes {0}
        env:
          # PRs opened with the default GITHUB_TOKEN cannot trigger workflow runs,
          # so CompatHelper's PRs never get CI and can never go green on their own.
          # If a COMPATHELPER_TOKEN secret (a PAT with `repo` scope) is present it is
          # used instead, and CI runs normally. Unset -> falls back to the old
          # behaviour, so this is a no-op until the secret is added.
          GITHUB_TOKEN: ${{ secrets.COMPATHELPER_TOKEN || secrets.GITHUB_TOKEN }}
          COMPATHELPER_PR_AUTHOR: ${{ steps.pr_author.outputs.login }}
          COMPATHELPER_PRIV: ${{ secrets.DOCUMENTER_KEY }}
          # COMPATHELPER_PRIV: ${{ secrets.COMPATHELPER_PRIV }}
